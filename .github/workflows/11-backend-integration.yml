# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: "11-backend-integration: Java Integration tests"

on:
  workflow_dispatch:
  pull_request:
    paths: [src/**, pom.xml, lombok.config]
  push:
    branches: [ main ]
    paths: [src/**, pom.xml, lombok.config]

jobs:
  build:
    # Playwright misbehaves on Ubuntu versions that are not yet in its version mapping
    # (e.g. ubuntu-26.04), so pin the runner instead of using ubuntu-latest.
    # The pinned version can be overridden with the PLAYWRIGHT_UBUNTU_VERSION
    # organization/repository variable.
    runs-on: ${{ vars.PLAYWRIGHT_UBUNTU_VERSION || 'ubuntu-24.04' }}
    timeout-minutes: 10
    
    steps:
    - uses: actions/checkout@v4
    - name: Set up Java (version from .java-version file)
      uses: actions/setup-java@v4
      with:
         distribution: semeru # See: https://github.com/actions/setup-java#supported-distributions
         java-version-file: ./.java-version
  
    - name: Run IT tests with maven
      run: INTEGRATION=true mvn -ntp -B test-compile failsafe:integration-test failsafe:verify
      
